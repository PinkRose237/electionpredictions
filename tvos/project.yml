name: ElectionNight
options:
  bundleIdPrefix: com.jamesgriffis
  deploymentTarget:
    tvOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: VHFS4A7KDU
    CODE_SIGN_STYLE: Automatic
targets:
  ElectionNight:
    type: application
    platform: tvOS
    sources:
      - path: ElectionNight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jamesgriffis.electionnight
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Election Night
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        TARGETED_DEVICE_FAMILY: "3"
