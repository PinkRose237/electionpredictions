[project]
name = "electionpredictions"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "James Griffis", email = "mykatiekakes14@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "feedparser>=6.0.14",
    "html5lib>=1.1",
    "lxml>=6.1.3",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "python-dateutil>=2.9.0.post0",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "scipy>=1.18.1",
]

[project.scripts]
electionpredictions = "electionpredictions.cli:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
