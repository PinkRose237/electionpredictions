name: Deploy site

# Redeploys GitHub Pages whenever files under site/ change on main — e.g. when the admin page
# publishes site/data/results.json. (Pushes made by the daily workflow's GITHUB_TOKEN do not
# trigger this workflow; that run deploys itself.)
on:
  push:
    branches: [main]
    paths: ["site/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
