name: Update forecast (2028)

# Every run is one full rebuild of the 2028 presidential model: refresh the evidence, recalibrate the model
# specification, revise it against the evidence (OPENCODE_API_KEY), run the final simulation, write the
# summaries, export site/data, commit and deploy. Twice a day, at 2:00 AM and 2:00 PM Eastern.
#
# GitHub schedules in UTC only, so both UTC hours that can be 2 AM / 2 PM in New York are scheduled and the
# `gate` job lets through only the one matching the current Eastern offset (EDT = UTC-4, EST = UTC-5).
on:
  schedule:
    - cron: "0 6 * * *"    # 2:00 AM EDT
    - cron: "0 7 * * *"    # 2:00 AM EST
    - cron: "0 18 * * *"   # 2:00 PM EDT
    - cron: "0 19 * * *"   # 2:00 PM EST
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run the pipeline but do not commit or deploy (uploads site/data as an artifact)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-forecast
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        name: Run only at 2 AM / 2 PM Eastern
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          case "${{ github.event.schedule }}" in
            "0 6 * * *"|"0 18 * * *") want=EDT ;;
            *) want=EST ;;
          esac
          now=$(TZ=America/New_York date +%Z)
          echo "Eastern time is on $now; this trigger is for $want"
          if [ "$now" = "$want" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "go=false" >> "$GITHUB_OUTPUT"; fi

  update:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.commit.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Restore database and caches
        uses: actions/cache@v4
        with:
          path: data
          key: data-2028-${{ github.run_id }}
          restore-keys: |
            data-2028-
      - run: uv sync
      - name: Rebuild the model and export
        env:
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}
        run: uv run electionpredictions run
      - name: Show the model log
        run: uv run electionpredictions status
      - if: inputs.dry_run
        uses: actions/upload-artifact@v4
        with:
          name: site-data
          path: site/data
      - id: commit
        if: ${{ !inputs.dry_run }}
        name: Commit published data
        run: |
          git config user.name "forecast-bot"
          git config user.email "forecast-bot@users.noreply.github.com"
          git add site/data
          git commit -m "Update forecast $(date -u +%FT%H:%MZ)" || echo "nothing to commit"
          git pull --rebase origin main
          git push
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - if: ${{ !inputs.dry_run }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: update
    if: needs.update.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
