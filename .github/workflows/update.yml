name: Update forecast

on:
  schedule:
    - cron: "17 11 * * *"   # daily, 11:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-forecast
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Restore database and caches
        uses: actions/cache@v4
        with:
          path: data
          key: data-${{ github.run_id }}
          restore-keys: |
            data-
      - run: uv sync
      - name: Run pipeline
        env:
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
          FOLLOWTHEMONEY_API_KEY: ${{ secrets.FOLLOWTHEMONEY_API_KEY }}
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: uv run electionpredictions run
      - name: Run presidential pipeline
        env:
          EP_CYCLE: "2028"
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: uv run electionpredictions run --skip followthemoney
      - name: Commit published data
        run: |
          git config user.name "forecast-bot"
          git config user.email "forecast-bot@users.noreply.github.com"
          git add site/data site/data2028
          git commit -m "Update forecast $(date -u +%F)" || echo "nothing to commit"
          git pull --rebase origin main
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
