name: Update forecast (2028)

# The forecast updates continuously: every 15 minutes this rebuilds the 2028 model end to end — refresh the
# evidence, recalibrate the specification, research and revise it (OPENCODE_API_KEY), run the final simulation,
# write the summaries, export and deploy. Run it by hand from the Actions tab; tick dry_run to skip saving and
# deploying (the exported data is attached as an artifact).
#
# State: the model database and the published data live on the `forecast-data` branch as a single commit that
# every run replaces, so main keeps only code and the repository does not grow with each update. HTTP responses
# are cached between runs with actions/cache (the per-source lifetimes are in config.py).
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run the pipeline but do not save state or deploy (uploads site/data as an artifact)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-forecast
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      publish: ${{ steps.save.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Restore the HTTP cache
        uses: actions/cache/restore@v4
        with:
          path: data/cache
          key: http-cache-${{ github.run_id }}
          restore-keys: |
            http-cache-
      - name: Restore the model state
        id: state
        uses: ./.github/actions/forecast-data
        with:
          database: "true"
      - name: First run only - recover the database from the old cache
        if: steps.state.outputs.has_db != 'true'
        uses: actions/cache/restore@v4
        with:
          path: data
          key: data-2028-${{ github.run_id }}
          restore-keys: |
            data-2028-
      - run: uv sync
      - name: Rebuild the model and export
        env:
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          AI_MODELS_REVISION: ${{ vars.AI_MODELS_REVISION }}
          AI_MODELS_NARRATIVE: ${{ vars.AI_MODELS_NARRATIVE }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}
        run: uv run electionpredictions run
      - name: Model status
        run: uv run electionpredictions status
      - if: inputs.dry_run
        uses: actions/upload-artifact@v4
        with:
          name: site-data
          path: site/data
      - id: save
        if: ${{ !inputs.dry_run }}
        name: Save the model state to the forecast-data branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out="$RUNNER_TEMP/state-out"
          rm -rf "$out" && mkdir -p "$out/site-data"
          uv run python -c "import sqlite3,sys; c=sqlite3.connect('data/president2028.db'); c.execute('VACUUM INTO ?', (sys.argv[1],))" "$out/president2028.db"
          cp -R site/data/. "$out/site-data/"
          printf '%s\n' "# forecast-data" "" \
            "Machine-written state of the 2028 presidential model, replaced on every update by .github/workflows/update.yml:" \
            "president2028.db (the model database, including every model version) and site-data/ (the published site/data)." \
            "Local copy: uv run electionpredictions sync-state" > "$out/README.md"
          cd "$out"
          git init -q -b forecast-data
          git add -A
          git -c user.name="forecast-bot" -c user.email="forecast-bot@users.noreply.github.com" commit -q -m "Forecast state $(date -u +%FT%H:%MZ)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" forecast-data
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - id: hour
        run: echo "hour=$(date -u +%Y%m%d%H)" >> "$GITHUB_OUTPUT"
      - name: Save the HTTP cache (once an hour)
        if: ${{ !inputs.dry_run }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: data/cache
          key: http-cache-${{ steps.hour.outputs.hour }}
      - if: ${{ !inputs.dry_run }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: update
    if: needs.update.outputs.publish == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
