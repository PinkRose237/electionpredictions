name: Results snapshot

# 2026 midterms (retired, admin-only archive at site/archive/2026): keep saving the live results feeds to
# site/archive/2026/data/results-auto.json and the outlets' race calls to calls.json while the last races are
# counted (through November), and redeploy. Visitors' browsers pull the feeds directly every minute; this snapshot is what they see when
# their browser can't reach the feeds, and what stays once the feeds go offline.
on:
  schedule:
    - cron: "*/10 23 3 11 *"    # Nov 3 from 6 pm ET
    - cron: "*/10 * 4-6 11 *"   # every 10 minutes through Friday
    - cron: "7 * 7-30 11 *"     # hourly for the rest of November
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: results-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run electionpredictions results
      - id: commit
        name: Commit the snapshot if it changed
        run: |
          git config user.name "forecast-bot"
          git config user.email "forecast-bot@users.noreply.github.com"
          git add site/archive/2026/data/results-auto.json site/archive/2026/data/calls.json
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "Results snapshot $(date -u +%FT%H:%MZ)"
          # The local `results --watch --push` may have pushed meanwhile; these files are generated, newest wins.
          git pull --rebase -X theirs origin main
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - if: steps.commit.outputs.changed == 'true'
        name: Add the latest 2028 forecast data (from the forecast-data branch)
        uses: ./.github/actions/forecast-data
      - if: steps.commit.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: snapshot
    if: needs.snapshot.outputs.changed == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
