name: AI probe

# Diagnostics: checks the AI gateway with the repository's key (masked by GitHub), lists the models it serves,
# and benchmarks candidate models on a small spec-revision task. Run it from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      models:
        description: "Comma-separated model ids to benchmark (blank = default candidates)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}
        run: |
          uv run electionpredictions ai-probe
          uv run electionpredictions ai-benchmark --models "${{ inputs.models }}"
