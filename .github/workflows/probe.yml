name: AI probe

# Diagnostics: one tiny request to the AI provider with the repository's key; prints statuses and
# response snippets (the key itself is masked by GitHub). Run it from the Actions tab.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}
        run: uv run electionpredictions ai-probe
